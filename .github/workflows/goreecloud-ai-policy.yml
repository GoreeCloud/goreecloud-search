---
name: GoreeCloud AI contribution policy

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - master
    paths:
      - 'AI_POLICY.rst'
      - 'CONTRIBUTING.rst'
      - '.github/workflows/goreecloud-ai-policy.yml'
      - '.github/workflows/goreecloud-workflow-supply-chain.yml'
      - 'tests/unit/test_goreecloud_ai_policy.py'
  push:
    branches:
      - master
    paths:
      - 'AI_POLICY.rst'
      - 'CONTRIBUTING.rst'
      - '.github/workflows/goreecloud-ai-policy.yml'
      - '.github/workflows/goreecloud-workflow-supply-chain.yml'
      - 'tests/unit/test_goreecloud_ai_policy.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-policy-contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Validate GoreeCloud AI contribution contract
        run: |
          set -euo pipefail
          python -m py_compile tests/unit/test_goreecloud_ai_policy.py
          PYTHONPATH=. python tests/unit/test_goreecloud_ai_policy.py
