---
name: GoreeCloud upstream container boundary

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  upstream-container-boundary:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Validate inherited container publication boundary
        run: PYTHONPATH=. python tests/unit/test_goreecloud_upstream_container_workflow.py
