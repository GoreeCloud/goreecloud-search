---
name: GoreeCloud first-Stable evidence audit

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
      - '.github/workflows/goreecloud-first-stable-evidence-audit.yml'
      - 'goreecloud/first_stable_evidence_audit.py'
      - 'goreecloud/first_stable_candidate_07_audit.py'
      - 'goreecloud/final_review_evidence_audit.py'
      - 'tests/unit/test_goreecloud_first_stable_evidence_audit.py'
      - 'tests/unit/test_goreecloud_first_stable_candidate_07_audit.py'
      - 'tests/unit/test_goreecloud_final_review_evidence_audit.py'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/goreecloud-first-stable-evidence-audit.yml'
      - 'goreecloud/first_stable_evidence_audit.py'
      - 'goreecloud/first_stable_candidate_07_audit.py'
      - 'goreecloud/final_review_evidence_audit.py'
      - 'tests/unit/test_goreecloud_first_stable_evidence_audit.py'
      - 'tests/unit/test_goreecloud_first_stable_candidate_07_audit.py'
      - 'tests/unit/test_goreecloud_final_review_evidence_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-safety-audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Validate audit source
        run: |
          set -euo pipefail
          python -m py_compile \
            goreecloud/first_stable_evidence_audit.py \
            goreecloud/first_stable_candidate_07_audit.py \
            goreecloud/final_review_evidence_audit.py \
            tests/unit/test_goreecloud_first_stable_evidence_audit.py \
            tests/unit/test_goreecloud_first_stable_candidate_07_audit.py \
            tests/unit/test_goreecloud_final_review_evidence_audit.py
          python goreecloud/first_stable_evidence_audit.py --help | grep -q -- '--final-evidence'
          python goreecloud/first_stable_candidate_07_audit.py --help | grep -q -- '--target-runtime-evidence'
          python goreecloud/first_stable_candidate_07_audit.py --help | grep -q -- '--rollback-baseline'
          python goreecloud/first_stable_candidate_07_audit.py --help | grep -q -- '--final-evidence'
          python goreecloud/final_review_evidence_audit.py --help | grep -q -- '--final-evidence'

      - name: Run deterministic evidence-safety contract
        run: |
          set -euo pipefail
          python tests/unit/test_goreecloud_first_stable_evidence_audit.py
          python tests/unit/test_goreecloud_first_stable_candidate_07_audit.py
          python tests/unit/test_goreecloud_final_review_evidence_audit.py
