---
name: GoreeCloud workflow supply-chain guard

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
      - 'agent/**'
    paths:
      - '.github/workflows/goreecloud-*.yml'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/goreecloud-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-supply-chain:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Validate immutable GoreeCloud workflow dependencies
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.github/workflows')
          workflows = tuple(sorted(path.name for path in root.glob('goreecloud-*.yml')))
          required_workflows = {
              'goreecloud-ai-policy.yml',
              'goreecloud-api-v1-status.yml',
              'goreecloud-browser-acceptance.yml',
              'goreecloud-candidate-artifact-provenance-audit.yml',
              'goreecloud-container-build.yml',
              'goreecloud-first-stable-evidence-audit.yml',
              'goreecloud-first-stable-readiness.yml',
              'goreecloud-foundation.yml',
              'goreecloud-home-preferences-v2.yml',
              'goreecloud-provider-acceptance.yml',
              'goreecloud-provider-result-integrity-audit.yml',
              'goreecloud-rc-publication.yml',
              'goreecloud-runtime-smoke.yml',
              'goreecloud-workflow-supply-chain.yml',
          }
          assert required_workflows <= set(workflows), (
              f'missing required GoreeCloud workflow(s): {sorted(required_workflows - set(workflows))}'
          )

          exact_checkout = 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
          exact_python = 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97'
          exact_upload = 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'
          runner_ref = re.compile(r'^\s*runs-on:\s*([^\s#]+)')
          action_ref = re.compile(r'^\s*uses:\s*([^\s#]+)')
          immutable_ref = re.compile(r'^[^@]+@[0-9a-f]{40}$')
          permission_ref = re.compile(r'^  ([a-z-]+):\s*(read|write|none)\s*(?:#.*)?$')
          persist_credentials_ref = re.compile(
              r'^\s+persist-credentials:\s*["\']?false["\']?\s*(?:#.*)?$'
          )
          expected_permissions = {
              'goreecloud-provider-acceptance.yml': {
                  'contents': 'read',
                  'packages': 'read',
              },
              'goreecloud-rc-publication.yml': {
                  'contents': 'read',
                  'packages': 'write',
              },
          }

          def read_top_level_permissions(lines, workflow_name):
              try:
                  start = lines.index('permissions:')
              except ValueError as exc:
                  raise AssertionError(f'missing top-level permissions block in {workflow_name}') from exc

              permissions = {}
              for line in lines[start + 1:]:
                  if line and not line.startswith((' ', '#')):
                      break
                  if not line.strip() or line.lstrip().startswith('#'):
                      continue
                  match = permission_ref.fullmatch(line)
                  assert match, f'unrecognized top-level permission entry {line!r} in {workflow_name}'
                  scope, access = match.groups()
                  permissions[scope] = access
              assert permissions, f'empty top-level permissions block in {workflow_name}'
              return permissions

          def checkout_persists_no_credentials(lines, checkout_index):
              checkout_indent = len(lines[checkout_index]) - len(lines[checkout_index].lstrip())
              for line in lines[checkout_index + 1:]:
                  if line.strip():
                      indent = len(line) - len(line.lstrip())
                      if indent < checkout_indent:
                          break
                      if indent == checkout_indent and line.lstrip().startswith('uses:'):
                          break
                  if persist_credentials_ref.fullmatch(line):
                      return True
              return False

          for name in workflows:
              path = root / name
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              runner_values = [
                  match.group(1)
                  for line in lines
                  if (match := runner_ref.match(line))
              ]
              assert runner_values, f'missing runner directive in {name}'
              assert all(value == 'ubuntu-26.04' for value in runner_values), (
                  f'unapproved runner directive(s) in {name}: {runner_values}'
              )

              observed_permissions = read_top_level_permissions(lines, name)
              allowed_permissions = expected_permissions.get(name, {'contents': 'read'})
              assert observed_permissions == allowed_permissions, (
                  f'unapproved workflow permissions in {name}: '
                  f'observed={observed_permissions}, expected={allowed_permissions}'
              )

              assert exact_checkout in text, f'checkout is not on the approved immutable pin in {name}'
              if 'actions/setup-python@' in text:
                  assert exact_python in text, f'setup-python is not on the approved immutable pin in {name}'
              if 'actions/upload-artifact@' in text:
                  assert exact_upload in text, f'upload-artifact is not on the approved immutable pin in {name}'

              checkout_count = 0
              for index, line in enumerate(lines):
                  match = action_ref.match(line)
                  if not match:
                      continue
                  ref = match.group(1)
                  assert immutable_ref.fullmatch(ref), f'mutable action reference {ref!r} in {name}'
                  if ref == exact_checkout:
                      checkout_count += 1
                      assert checkout_persists_no_credentials(lines, index), (
                          f'checkout must set persist-credentials: false in {name}'
                      )
              assert checkout_count, f'missing checkout step in {name}'

          print(
              f'Validated all {len(workflows)} GoreeCloud workflows with immutable dependencies, '
              'least-privilege token permissions, and non-persisted checkout credentials.'
          )
          PY
