---
name: GoreeCloud runtime smoke

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare GoreeCloud runtime settings
        shell: bash
        run: |
          set -euo pipefail
          cp goreecloud/settings.yml.example /tmp/goreecloud-search-settings.yml
          python - <<'PY'
          import yaml
          from pathlib import Path

          path = Path('/tmp/goreecloud-search-settings.yml')
          data = yaml.safe_load(path.read_text())
          headers = data['server']['default_http_headers']
          assert data['general']['instance_name'] == 'GoreeCloud Search'
          assert data['general']['enable_metrics'] is False
          assert data['server']['image_proxy'] is True
          assert data['server']['public_instance'] is False
          assert headers['X-Robots-Tag'] == 'noindex, nofollow'
          assert headers['Referrer-Policy'] == 'no-referrer'
          assert headers['X-Frame-Options'] == 'DENY'
          assert headers['Permissions-Policy'] == 'camera=(), microphone=(), geolocation=()'
          assert data['search']['formats'] == ['html']
          PY

      - name: Start GoreeCloud Search
        env:
          SEARXNG_SETTINGS_PATH: /tmp/goreecloud-search-settings.yml
          SEARXNG_SECRET: goreecloud-ci-only-secret-not-for-production
          SEARXNG_BIND_ADDRESS: 127.0.0.1
          SEARXNG_PORT: '8888'
          SEARXNG_DISABLE_ETC_SETTINGS: 'true'
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m searx.webapp >/tmp/goreecloud-search.log 2>&1 &
          echo $! >/tmp/goreecloud-search.pid

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8888/ >/tmp/index.html; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/goreecloud-search.pid)" 2>/dev/null; then
              cat /tmp/goreecloud-search.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/goreecloud-search.log
          exit 1

      - name: Validate rendered product shell
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<title>GoreeCloud Search</title>' /tmp/index.html
          grep -q 'GoreeCloud Search' /tmp/index.html
          grep -q 'goreecloud.css' /tmp/index.html
          grep -q 'name="robots" content="noindex, nofollow, noarchive"' /tmp/index.html
          grep -q 'Powered by' /tmp/index.html
          grep -q 'SearXNG' /tmp/index.html

          curl --fail --silent --show-error \
            http://127.0.0.1:8888/preferences >/tmp/preferences.html
          grep -q 'GoreeCloud Search' /tmp/preferences.html

          curl --fail --silent --show-error \
            'http://127.0.0.1:8888/search?q=GoreeCloud+Search' >/tmp/search.html
          grep -q 'GoreeCloud Search' /tmp/search.html
          grep -q 'goreecloud.css' /tmp/search.html

      - name: Validate GoreeCloud API status, readiness, and health
        shell: bash
        run: |
          set -euo pipefail
          marker='goreecloud-private-query-marker'
          curl --fail --silent --show-error \
            --dump-header /tmp/api-status-headers.txt \
            "http://127.0.0.1:8888/api/v1/status?q=${marker}" \
            >/tmp/api-status.json

          grep -qi '^cache-control: no-store' /tmp/api-status-headers.txt
          grep -qi '^pragma: no-cache' /tmp/api-status-headers.txt
          grep -qi '^x-goreecloud-api-version: 1' /tmp/api-status-headers.txt
          if grep -q "$marker" /tmp/api-status.json; then
            echo 'API status response echoed query input' >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --dump-header /tmp/api-readiness-headers.txt \
            "http://127.0.0.1:8888/api/v1/readiness?q=${marker}" \
            >/tmp/api-readiness.json

          grep -qi '^cache-control: no-store' /tmp/api-readiness-headers.txt
          grep -qi '^pragma: no-cache' /tmp/api-readiness-headers.txt
          grep -qi '^x-goreecloud-api-version: 1' /tmp/api-readiness-headers.txt
          if grep -q "$marker" /tmp/api-readiness.json; then
            echo 'API readiness response echoed query input' >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --dump-header /tmp/healthz-headers.txt \
            http://127.0.0.1:8888/healthz \
            >/tmp/healthz.txt
          grep -qi '^content-type: text/plain' /tmp/healthz-headers.txt
          grep -qx 'OK' /tmp/healthz.txt

          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('/tmp/api-status.json').read_text(encoding='utf-8'))
          assert status['api_version'] == '1'
          assert status['product'] == 'GoreeCloud Search'
          assert status['service'] == 'search'
          assert status['status'] == 'ok'
          assert status['foundation']['name'] == 'SearXNG'
          assert status['foundation']['version']
          assert status['capabilities']['html_search'] is True
          assert status['capabilities']['opensearch'] is True
          assert status['capabilities']['machine_readable_search_api'] is False
          assert status['endpoints'] == {
              'health': '/healthz',
              'opensearch': '/opensearch.xml',
              'readiness': '/api/v1/readiness',
              'search': '/search',
          }
          for forbidden in ('engines', 'plugins', 'preferences'):
              assert forbidden not in status

          readiness = json.loads(
              Path('/tmp/api-readiness.json').read_text(encoding='utf-8')
          )
          assert readiness['api_version'] == '1'
          assert readiness['product'] == 'GoreeCloud Search'
          assert readiness['service'] == 'search'
          assert readiness['status'] == 'ready'
          assert readiness['ready'] is True
          assert readiness['readiness_scope'] == 'local_application'
          assert all(readiness['checks'].values())
          assert readiness['not_evaluated'] == [
              'external_search_providers',
              'dns',
              'reverse_proxy',
              'monitoring_and_alert_delivery',
              'backup_restore_and_rollback',
          ]
          for forbidden in ('engines', 'plugins', 'preferences', 'query', 'results'):
              assert forbidden not in readiness
          PY

      - name: Validate privacy-facing headers
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --head \
            http://127.0.0.1:8888/ >/tmp/headers.txt
          grep -qi '^referrer-policy: no-referrer' /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt
          grep -qi '^permissions-policy: camera=(), microphone=(), geolocation=()' /tmp/headers.txt
          grep -qi '^x-robots-tag: noindex, nofollow' /tmp/headers.txt

      - name: Print application log on failure
        if: failure()
        run: cat /tmp/goreecloud-search.log || true
