name: GoreeCloud Search Native Foundation

"on":
  pull_request:
    paths:
      - native/**
      - .github/workflows/goreecloud-native-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-foundation:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00  # v6.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - name: Test native core
        working-directory: native
        run: go test ./...
      - name: Build native service
        working-directory: native
        run: go build ./cmd/searchd
