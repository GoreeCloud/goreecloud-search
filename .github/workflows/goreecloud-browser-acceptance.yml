---
name: GoreeCloud browser acceptance

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install application and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt selenium==4.47.0

      - name: Prepare GoreeCloud runtime settings
        shell: bash
        run: |
          set -euo pipefail
          cp goreecloud/settings.yml.example /tmp/goreecloud-search-settings.yml

      - name: Start GoreeCloud Search
        env:
          SEARXNG_SETTINGS_PATH: /tmp/goreecloud-search-settings.yml
          SEARXNG_SECRET: goreecloud-ci-only-secret-not-for-production
          SEARXNG_BIND_ADDRESS: 127.0.0.1
          SEARXNG_PORT: '8888'
          SEARXNG_DISABLE_ETC_SETTINGS: 'true'
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m searx.webapp >/tmp/goreecloud-search-browser.log 2>&1 &
          echo $! >/tmp/goreecloud-search-browser.pid

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8888/ >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/goreecloud-search-browser.pid)" 2>/dev/null; then
              cat /tmp/goreecloud-search-browser.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/goreecloud-search-browser.log
          exit 1

      - name: Run Glaze UI adaptive browser acceptance
        env:
          GOREECLOUD_SEARCH_TEST_URL: http://127.0.0.1:8888
          GOREECLOUD_SEARCH_SCREENSHOT_DIR: /tmp/goreecloud-search-ui-screenshots
        run: python goreecloud/browser_acceptance.py

      - name: Preserve exact-head UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: goreecloud-search-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/goreecloud-search-ui-screenshots
          if-no-files-found: error
          retention-days: 7

      - name: Print application log on failure
        if: failure()
        run: cat /tmp/goreecloud-search-browser.log || true
