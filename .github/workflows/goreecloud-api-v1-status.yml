---
name: GoreeCloud API v1 service contract

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
      - '.github/workflows/goreecloud-api-v1-status.yml'
      - '.github/workflows/goreecloud-runtime-smoke.yml'
      - 'searx/plugins/__init__.py'
      - 'searx/plugins/goreecloud_api.py'
      - 'searx/webapp.py'
      - 'docs/goreecloud/API.md'
      - 'docs/goreecloud/READINESS.md'
      - 'tests/unit/test_goreecloud_api_plugin.py'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/goreecloud-api-v1-status.yml'
      - '.github/workflows/goreecloud-runtime-smoke.yml'
      - 'searx/plugins/__init__.py'
      - 'searx/plugins/goreecloud_api.py'
      - 'searx/webapp.py'
      - 'docs/goreecloud/API.md'
      - 'docs/goreecloud/READINESS.md'
      - 'tests/unit/test_goreecloud_api_plugin.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-v1-service-contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Validate Python source
        run: |
          set -euo pipefail
          python -m py_compile \
            searx/plugins/__init__.py \
            searx/plugins/goreecloud_api.py \
            tests/unit/test_goreecloud_api_plugin.py

      - name: Verify API v1 service contract markers
        run: |
          set -euo pipefail
          grep -q '/api/v1/status' searx/plugins/goreecloud_api.py
          grep -q '/api/v1/readiness' searx/plugins/goreecloud_api.py
          grep -q 'machine_readable_search_api' searx/plugins/goreecloud_api.py
          grep -q 'readiness_scope' searx/plugins/goreecloud_api.py
          grep -q 'response.status_code = 200 if ready else 503' \
            searx/plugins/goreecloud_api.py
          grep -q 'Cache-Control.*no-store' searx/plugins/goreecloud_api.py
          grep -q 'X-GoreeCloud-API-Version' searx/plugins/goreecloud_api.py
          grep -q 'GoreeCloudAPIPlugin' searx/plugins/__init__.py
          grep -q "@app.route('/healthz'" searx/webapp.py
          grep -q "Response('OK', mimetype='text/plain')" searx/webapp.py
          grep -q 'Query-string input is ignored' docs/goreecloud/API.md
          grep -q 'machine_readable_search_api.*false' docs/goreecloud/API.md
          grep -q 'GET /api/v1/readiness' docs/goreecloud/API.md
          grep -q 'HTTP 503' docs/goreecloud/API.md
          grep -q 'readiness_scope.*local_application' docs/goreecloud/API.md
          grep -q 'Existing process health.*GET /healthz' docs/goreecloud/API.md
          grep -q 'Local application readiness.*GET /api/v1/readiness' \
            docs/goreecloud/READINESS.md
          grep -q 'Neither `/healthz` nor `/api/v1/readiness`' \
            docs/goreecloud/READINESS.md
          grep -q 'Glaze UI 1.1.0' docs/goreecloud/READINESS.md
