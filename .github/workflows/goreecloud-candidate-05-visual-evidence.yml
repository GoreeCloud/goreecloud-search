---
name: GoreeCloud candidate 05 visual evidence

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - agent/candidate-05-visual-evidence
    paths:
      - '.github/workflows/goreecloud-candidate-05-visual-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  candidate-visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SOURCE: a5b398da75902fea22399359b84e4d229a6a4791
      CANDIDATE_IMAGE: ghcr.io/goreecloud/goreecloud-search@sha256:894bdb8572aea33a16a31702448dc8f161e401b3eab9432a85a162bf9b33de1d
      CANDIDATE_CONTAINER: goreecloud-search-candidate-05-visual
      CANDIDATE_PORT: '8888'

    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@v4
        with:
          ref: a5b398da75902fea22399359b84e4d229a6a4791
          persist-credentials: false

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | podman login ghcr.io \
                --username '${{ github.actor }}' \
                --password-stdin

      - name: Pull and verify immutable candidate identity
        shell: bash
        run: |
          set -euo pipefail
          podman pull "$CANDIDATE_IMAGE"
          title="$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.title" }}' "$CANDIDATE_IMAGE")"
          revision="$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.revision" }}' "$CANDIDATE_IMAGE")"
          source="$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.source" }}' "$CANDIDATE_IMAGE")"
          licenses="$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.licenses" }}' "$CANDIDATE_IMAGE")"
          version="$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.version" }}' "$CANDIDATE_IMAGE")"
          test "$title" = 'GoreeCloud Search'
          test "$revision" = "$CANDIDATE_SOURCE"
          test "$source" = 'https://github.com/GoreeCloud/goreecloud-search'
          test "$licenses" = 'AGPL-3.0-or-later'
          test -n "$version"
          printf 'GOREECLOUD_CANDIDATE_OCI_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Start exact candidate on loopback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-visual-searxng screenshots snapshots
          cp goreecloud/settings.yml.example .ci-visual-searxng/settings.yml
          podman run --detach \
            --name "$CANDIDATE_CONTAINER" \
            --publish "127.0.0.1:${CANDIDATE_PORT}:8080" \
            --env SEARXNG_SECRET=goreecloud-visual-evidence-only-secret \
            --env FORCE_OWNERSHIP=false \
            --volume "$PWD/.ci-visual-searxng:/etc/searxng:ro" \
            "$CANDIDATE_IMAGE" >/tmp/goreecloud-candidate-05-visual-container-id

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${CANDIDATE_PORT}/healthz" >/tmp/goreecloud-candidate-05-healthz.txt; then
              ready=1
              break
            fi
            if [ "$(podman inspect -f '{{.State.Running}}' "$CANDIDATE_CONTAINER" 2>/dev/null || true)" != 'true' ]; then
              podman logs "$CANDIDATE_CONTAINER" || true
              exit 1
            fi
            sleep 1
          done
          test "$ready" = '1'

          curl --fail --silent --show-error \
            "http://127.0.0.1:${CANDIDATE_PORT}/" > snapshots/home.html
          curl --fail --silent --show-error \
            "http://127.0.0.1:${CANDIDATE_PORT}/preferences" > snapshots/preferences.html
          curl --fail --silent --show-error \
            "http://127.0.0.1:${CANDIDATE_PORT}/stats" > snapshots/provider-diagnostics.html

          grep -q '<title>GoreeCloud Search</title>' snapshots/home.html
          grep -q 'goreecloud-preferences-form' snapshots/preferences.html
          grep -q 'Provider diagnostics' snapshots/provider-diagnostics.html
          ! grep -q 'error.log_parameters' snapshots/provider-diagnostics.html
          ! grep -q 'error.filename' snapshots/provider-diagnostics.html

      - name: Capture Compact and Expanded visual evidence
        shell: bash
        run: |
          set -euo pipefail

          if command -v google-chrome >/dev/null 2>&1; then
            CHROME="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            CHROME="$(command -v chromium)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            CHROME="$(command -v chromium-browser)"
          else
            echo 'No supported Chromium browser is installed on this runner.' >&2
            exit 1
          fi

          capture() {
            viewport="$1"
            theme="$2"
            page="$3"
            path="$4"
            dark_flag=()
            if [ "$theme" = 'dark' ]; then
              dark_flag=(--force-dark-mode)
            fi
            profile="$(mktemp -d)"
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --disable-gpu \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --window-size="$viewport" \
              --virtual-time-budget=2500 \
              --user-data-dir="$profile" \
              "${dark_flag[@]}" \
              --screenshot="$path" \
              "http://127.0.0.1:${CANDIDATE_PORT}${page}"
            test -s "$path"
            rm -rf "$profile"
          }

          for theme in light dark; do
            capture '412,915' "$theme" '/' "screenshots/compact-${theme}-home.png"
            capture '412,915' "$theme" '/preferences' "screenshots/compact-${theme}-preferences.png"
            capture '412,915' "$theme" '/stats' "screenshots/compact-${theme}-provider-diagnostics.png"
            capture '1440,1000' "$theme" '/' "screenshots/expanded-${theme}-home.png"
            capture '1440,1000' "$theme" '/preferences' "screenshots/expanded-${theme}-preferences.png"
            capture '1440,1000' "$theme" '/stats' "screenshots/expanded-${theme}-provider-diagnostics.png"
          done

          count="$(find screenshots -type f -name '*.png' | wc -l | tr -d ' ')"
          test "$count" = '12'

      - name: Write sanitized visual evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          before_id="$(podman inspect --format '{{.Image}}' "$CANDIDATE_CONTAINER")"
          expected_id="$(podman image inspect --format '{{.Id}}' "$CANDIDATE_IMAGE")"
          test "$before_id" = "$expected_id"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          screenshots = sorted(str(p) for p in Path('screenshots').glob('*.png'))
          snapshots = sorted(str(p) for p in Path('snapshots').glob('*.html'))
          manifest = {
              'schema_version': 1,
              'product': 'GoreeCloud Search',
              'candidate_source': os.environ['CANDIDATE_SOURCE'],
              'candidate_image': os.environ['CANDIDATE_IMAGE'],
              'candidate_oci_version': os.environ['GOREECLOUD_CANDIDATE_OCI_VERSION'],
              'runtime': {
                  'base_url': f"http://127.0.0.1:{os.environ['CANDIDATE_PORT']}",
                  'container': os.environ['CANDIDATE_CONTAINER'],
                  'loopback_only': True,
                  'identity_verified_after_capture': True,
              },
              'viewport_evidence': {
                  'compact': '412x915',
                  'expanded': '1440x1000',
              },
              'theme_evidence': {
                  'light': 'runner default light rendering',
                  'dark': 'Chromium --force-dark-mode rendering',
              },
              'pages': ['/', '/preferences', '/stats'],
              'screenshots': screenshots,
              'html_snapshots': snapshots,
              'manual_visual_acceptance': False,
              'physical_android_acceptance': False,
              'desktop_runtime_acceptance': False,
              'statement': (
                  'This evidence captures exact-candidate loopback rendering for review. '
                  'It does not substitute for human visual acceptance, physical Android review, '
                  'actual GoreeCloud Browser runtime validation, or production cutover approval.'
              ),
          }
          Path('visual-evidence.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

          sha256sum screenshots/*.png snapshots/*.html visual-evidence.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Show candidate diagnostics on failure
        if: failure()
        shell: bash
        run: |
          podman ps -a || true
          podman logs "$CANDIDATE_CONTAINER" || true
          find screenshots snapshots -maxdepth 1 -type f -ls || true

      - name: Clean isolated candidate container
        if: always()
        shell: bash
        run: |
          podman rm --force "$CANDIDATE_CONTAINER" || true

      - name: Upload candidate visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-search-candidate-05-visual-evidence
          path: |
            screenshots/
            snapshots/
            visual-evidence.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90
