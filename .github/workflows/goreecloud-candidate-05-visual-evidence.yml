---
name: GoreeCloud candidate 05 visual evidence

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - agent/candidate-05-visual-evidence
    paths:
      - '.github/workflows/goreecloud-candidate-05-visual-evidence.yml'
  pull_request:
    branches:
      - agent/mobile-stabilization
    paths:
      - '.github/workflows/goreecloud-candidate-05-visual-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  candidate-visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SOURCE: a5b398da75902fea22399359b84e4d229a6a4791
      CANDIDATE_IMAGE: ghcr.io/goreecloud/goreecloud-search@sha256:894bdb8572aea33a16a31702448dc8f161e401b3eab9432a85a162bf9b33de1d
      CANDIDATE_CONTAINER: goreecloud-search-candidate-05-visual
      CANDIDATE_PORT: '8888'
      DARK_PROXY_PORT: '8890'

    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@v4
        with:
          ref: a5b398da75902fea22399359b84e4d229a6a4791
          persist-credentials: false

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | podman login ghcr.io \
                --username '${{ github.actor }}' \
                --password-stdin

      - name: Pull and verify immutable candidate identity
        shell: bash
        run: |
          set -euo pipefail
          podman pull "$CANDIDATE_IMAGE"
          title="$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.title" }}' "$CANDIDATE_IMAGE")"
          revision="$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.revision" }}' "$CANDIDATE_IMAGE")"
          source="$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.source" }}' "$CANDIDATE_IMAGE")"
          licenses="$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.licenses" }}' "$CANDIDATE_IMAGE")"
          version="$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.version" }}' "$CANDIDATE_IMAGE")"
          test "$title" = 'GoreeCloud Search'
          test "$revision" = "$CANDIDATE_SOURCE"
          test "$source" = 'https://github.com/GoreeCloud/goreecloud-search'
          test "$licenses" = 'AGPL-3.0-or-later'
          test -n "$version"
          printf 'GOREECLOUD_CANDIDATE_OCI_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Start exact candidate on loopback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-visual-searxng screenshots snapshots
          cp goreecloud/settings.yml.example .ci-visual-searxng/settings.yml
          podman run --detach \
            --name "$CANDIDATE_CONTAINER" \
            --publish "127.0.0.1:${CANDIDATE_PORT}:8080" \
            --env SEARXNG_SECRET=goreecloud-visual-evidence-only-secret \
            --env FORCE_OWNERSHIP=false \
            --volume "$PWD/.ci-visual-searxng:/etc/searxng:ro" \
            "$CANDIDATE_IMAGE" >/tmp/goreecloud-candidate-05-visual-container-id

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${CANDIDATE_PORT}/healthz" >/tmp/goreecloud-candidate-05-healthz.txt; then
              ready=1
              break
            fi
            if [ "$(podman inspect -f '{{.State.Running}}' "$CANDIDATE_CONTAINER" 2>/dev/null || true)" != 'true' ]; then
              podman logs "$CANDIDATE_CONTAINER" || true
              exit 1
            fi
            sleep 1
          done
          test "$ready" = '1'

          curl --fail --silent --show-error \
            "http://127.0.0.1:${CANDIDATE_PORT}/" > snapshots/home.html
          curl --fail --silent --show-error \
            "http://127.0.0.1:${CANDIDATE_PORT}/preferences" > snapshots/preferences.html
          curl --fail --silent --show-error \
            "http://127.0.0.1:${CANDIDATE_PORT}/stats" > snapshots/provider-diagnostics.html

          grep -q '<title>GoreeCloud Search</title>' snapshots/home.html
          grep -q 'goreecloud-preferences-form' snapshots/preferences.html
          grep -q 'Provider diagnostics' snapshots/provider-diagnostics.html
          ! grep -q 'error.log_parameters' snapshots/provider-diagnostics.html
          ! grep -q 'error.filename' snapshots/provider-diagnostics.html

      - name: Capture Compact and Expanded visual evidence
        shell: bash
        run: |
          set -euo pipefail

          if command -v google-chrome >/dev/null 2>&1; then
            CHROME="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            CHROME="$(command -v chromium)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            CHROME="$(command -v chromium-browser)"
          else
            echo 'No supported Chromium browser is installed on this runner.' >&2
            exit 1
          fi

          cat >/tmp/goreecloud-dark-theme-proxy.py <<'PY'
          import re
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          UPSTREAM = 'http://127.0.0.1:8888'

          class Proxy(BaseHTTPRequestHandler):
              def do_GET(self):
                  try:
                      req = Request(
                          UPSTREAM + self.path,
                          headers={
                              'Accept': self.headers.get('Accept', '*/*'),
                              'User-Agent': self.headers.get('User-Agent', 'GoreeCloud-visual-evidence'),
                          },
                      )
                      with urlopen(req, timeout=15) as resp:
                          status = resp.status
                          content_type = resp.headers.get('Content-Type', 'application/octet-stream')
                          body = resp.read()
                  except HTTPError as exc:
                      status = exc.code
                      content_type = exc.headers.get('Content-Type', 'text/plain')
                      body = exc.read()

                  if 'text/html' in content_type:
                      body = re.sub(
                          rb'(<html\b[^>]*\bclass=")([^"]*\btheme-)(?:auto|light|dark|black)(\b[^"]*")',
                          rb'\1\2dark\3',
                          body,
                          count=1,
                      )

                  self.send_response(status)
                  self.send_header('Content-Type', content_type)
                  self.send_header('Content-Length', str(len(body)))
                  self.send_header('Cache-Control', 'no-store')
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, _format, *_args):
                  return

          ThreadingHTTPServer(('127.0.0.1', 8890), Proxy).serve_forever()
          PY

          python /tmp/goreecloud-dark-theme-proxy.py >/tmp/goreecloud-dark-theme-proxy.log 2>&1 &
          echo "$!" >/tmp/goreecloud-dark-theme-proxy.pid

          dark_ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${DARK_PROXY_PORT}/" >/tmp/goreecloud-dark-home.html \
              && grep -q 'theme-dark' /tmp/goreecloud-dark-home.html; then
              dark_ready=1
              break
            fi
            sleep 1
          done
          test "$dark_ready" = '1'
          ! grep -q 'theme-auto' /tmp/goreecloud-dark-home.html

          capture() {
            viewport="$1"
            base_url="$2"
            page="$3"
            path="$4"
            profile="$(mktemp -d)"
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --disable-gpu \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --window-size="$viewport" \
              --virtual-time-budget=2500 \
              --user-data-dir="$profile" \
              --screenshot="$path" \
              "${base_url}${page}"
            test -s "$path"
            rm -rf "$profile"
          }

          light_url="http://127.0.0.1:${CANDIDATE_PORT}"
          dark_url="http://127.0.0.1:${DARK_PROXY_PORT}"

          capture '412,915' "$light_url" '/' screenshots/compact-light-home.png
          capture '412,915' "$light_url" '/preferences' screenshots/compact-light-preferences.png
          capture '412,915' "$light_url" '/stats' screenshots/compact-light-provider-diagnostics.png
          capture '1440,1000' "$light_url" '/' screenshots/expanded-light-home.png
          capture '1440,1000' "$light_url" '/preferences' screenshots/expanded-light-preferences.png
          capture '1440,1000' "$light_url" '/stats' screenshots/expanded-light-provider-diagnostics.png

          capture '412,915' "$dark_url" '/' screenshots/compact-dark-home.png
          capture '412,915' "$dark_url" '/preferences' screenshots/compact-dark-preferences.png
          capture '412,915' "$dark_url" '/stats' screenshots/compact-dark-provider-diagnostics.png
          capture '1440,1000' "$dark_url" '/' screenshots/expanded-dark-home.png
          capture '1440,1000' "$dark_url" '/preferences' screenshots/expanded-dark-preferences.png
          capture '1440,1000' "$dark_url" '/stats' screenshots/expanded-dark-provider-diagnostics.png

          count="$(find screenshots -type f -name '*.png' | wc -l | tr -d ' ')"
          test "$count" = '12'

          kill "$(cat /tmp/goreecloud-dark-theme-proxy.pid)"
          rm -f /tmp/goreecloud-dark-theme-proxy.pid

      - name: Write sanitized visual evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          before_id="$(podman inspect --format '{{.Image}}' "$CANDIDATE_CONTAINER")"
          expected_id="$(podman image inspect --format '{{.Id}}' "$CANDIDATE_IMAGE")"
          test "$before_id" = "$expected_id"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          screenshots = sorted(str(p) for p in Path('screenshots').glob('*.png'))
          snapshots = sorted(str(p) for p in Path('snapshots').glob('*.html'))
          manifest = {
              'schema_version': 2,
              'product': 'GoreeCloud Search',
              'candidate_source': os.environ['CANDIDATE_SOURCE'],
              'candidate_image': os.environ['CANDIDATE_IMAGE'],
              'candidate_oci_version': os.environ['GOREECLOUD_CANDIDATE_OCI_VERSION'],
              'runtime': {
                  'base_url': f"http://127.0.0.1:{os.environ['CANDIDATE_PORT']}",
                  'container': os.environ['CANDIDATE_CONTAINER'],
                  'loopback_only': True,
                  'candidate_runtime_unmodified': True,
                  'identity_verified_after_capture': True,
              },
              'viewport_evidence': {
                  'compact': '412x915',
                  'expanded': '1440x1000',
              },
              'theme_evidence': {
                  'light': {
                      'method': 'direct exact-candidate runtime rendering',
                      'root_theme_class': 'theme-auto',
                  },
                  'dark': {
                      'method': 'loopback evidence proxy rewrites only the rendered HTML root theme class to theme-dark',
                      'root_theme_class': 'theme-dark',
                      'candidate_runtime_mutated': False,
                      'preference_persistence_tested': False,
                  },
              },
              'pages': ['/', '/preferences', '/stats'],
              'screenshots': screenshots,
              'html_snapshots': snapshots,
              'manual_visual_acceptance': False,
              'physical_android_acceptance': False,
              'desktop_runtime_acceptance': False,
              'theme_preference_persistence_acceptance': False,
              'statement': (
                  'This evidence captures exact-candidate loopback rendering for review. '
                  'Dark screenshots exercise the product theme-dark CSS through a loopback-only '
                  'HTML-class evidence proxy without modifying the candidate runtime. It does not '
                  'substitute for human visual acceptance, persisted theme preference validation, '
                  'physical Android review, actual GoreeCloud Browser runtime validation, or '
                  'production cutover approval.'
              ),
          }
          Path('visual-evidence.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

          sha256sum screenshots/*.png snapshots/*.html visual-evidence.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Show candidate diagnostics on failure
        if: failure()
        shell: bash
        run: |
          podman ps -a || true
          podman logs "$CANDIDATE_CONTAINER" || true
          cat /tmp/goreecloud-dark-theme-proxy.log 2>/dev/null || true
          find screenshots snapshots -maxdepth 1 -type f -ls || true

      - name: Clean isolated evidence runtime
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/goreecloud-dark-theme-proxy.pid ]; then
            kill "$(cat /tmp/goreecloud-dark-theme-proxy.pid)" || true
          fi
          podman rm --force "$CANDIDATE_CONTAINER" || true

      - name: Upload candidate visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-search-candidate-05-visual-evidence
          path: |
            screenshots/
            snapshots/
            visual-evidence.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90
