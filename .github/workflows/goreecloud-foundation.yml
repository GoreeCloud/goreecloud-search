---
name: GoreeCloud foundation

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate Python source syntax
        run: python -m compileall -q searx goreecloud

      - name: Validate GoreeCloud product markers
        shell: bash
        run: |
          set -euo pipefail
          test -f GORECLOUD.md
          test -f SECURITY.md
          test -f CONTRIBUTING.rst
          test -f docs/goreecloud/UPSTREAM.md
          test -f docs/goreecloud/API.md
          test -f docs/goreecloud/DEPLOYMENT.md
          test -f docs/goreecloud/READINESS.md
          test -f docs/goreecloud/TARGET-ACCEPTANCE.md
          test -f goreecloud/settings.yml.example
          test -f goreecloud/compose.yml.example
          test -f goreecloud/compose.production.yml.example
          test -f goreecloud/target_acceptance.sh
          test -f goreecloud/browser_acceptance.py
          test -f goreecloud/provider_acceptance.py
          test -f .github/workflows/goreecloud-runtime-smoke.yml
          test -f .github/workflows/goreecloud-container-build.yml
          test -f .github/workflows/goreecloud-browser-acceptance.yml
          test -f .github/workflows/goreecloud-provider-acceptance.yml
          test -f searx/static/themes/simple/goreecloud.css
          test -f searx/static/themes/simple/goreecloud-states.css
          grep -q 'GoreeCloud Search' README.rst
          grep -q 'GoreeCloud Search Security Policy' SECURITY.md
          grep -q 'Contributing to GoreeCloud Search' CONTRIBUTING.rst
          grep -q 'GoreeCloud Search' searx/templates/simple/base.html
          grep -q 'GoreeCloud Search' searx/templates/simple/index.html
          grep -q 'GoreeCloud Search' searx/templates/simple/search.html
          grep -q 'Private metasearch' searx/templates/simple/results.html
          grep -q '^# About GoreeCloud Search$' searx/infopage/en/about.md
          grep -q "if pagename == 'about':" searx/infopage/__init__.py
          grep -q 'GoreeCloud Search' goreecloud/settings.yml.example
          grep -q 'b2da6b90f2f8446557c91f67d6be5064ab785ecd' \
            docs/goreecloud/UPSTREAM.md

      - name: Validate maintained-fork ownership contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GoreeCloud Search issues' SECURITY.md
          grep -q 'Upstream SearXNG issues' SECURITY.md
          grep -q 'security@searxng.org' SECURITY.md
          grep -q 'GoreeCloud-owned changes' CONTRIBUTING.rst
          grep -q 'Upstream-capable changes' CONTRIBUTING.rst
          grep -q 'Glaze UI 1.0 is mandatory' CONTRIBUTING.rst
          grep -q 'GoreeCloud-maintained translation exists' CONTRIBUTING.rst
          grep -q 'GoreeCloud product content may intentionally fall back to English' \
            CONTRIBUTING.rst
          grep -q 'localized About route' goreecloud/browser_acceptance.py
          grep -q 'Report a bug in GoreeCloud Search' \
            .github/ISSUE_TEMPLATE/bug-report.md
          grep -q 'Request an improvement to GoreeCloud Search' \
            .github/ISSUE_TEMPLATE/feature-request.md
          grep -q 'Request a search engine/provider for GoreeCloud Search' \
            .github/ISSUE_TEMPLATE/engine-request.md
          grep -q 'Upstream SearXNG project' .github/ISSUE_TEMPLATE/config.yml

      - name: Validate browser product contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name="application-name" content="GoreeCloud Search"' \
            searx/templates/simple/base.html
          grep -q 'name="color-scheme" content="light dark"' \
            searx/templates/simple/base.html
          grep -q 'name="robots" content="noindex, nofollow, noarchive"' \
            searx/templates/simple/base.html
          grep -q 'goreecloud-states.css' searx/templates/simple/base.html
          grep -q 'rel="search"' searx/templates/simple/base.html
          grep -q 'rel="manifest"' searx/templates/simple/base.html
          grep -q 'goreecloud-page .pref-group' searx/static/themes/simple/goreecloud.css
          grep -q '_overflow_diagnostics' goreecloud/browser_acceptance.py
          grep -q '_assert_not_found' goreecloud/browser_acceptance.py
          grep -q 'Viewport("compact", 390, 844)' goreecloud/browser_acceptance.py
          grep -q 'Viewport("medium", 768, 900)' goreecloud/browser_acceptance.py
          grep -q 'Viewport("expanded", 1280, 900)' goreecloud/browser_acceptance.py
          grep -q 'Viewport("wide", 1600, 1000)' goreecloud/browser_acceptance.py

      - name: Validate Glaze UI 1.0 contract
        shell: bash
        run: |
          set -euo pipefail
          css='searx/static/themes/simple/goreecloud.css'
          states='searx/static/themes/simple/goreecloud-states.css'
          grep -q -- '--gc-accent: #366cf6' "$css"
          grep -q -- '--gc-accent-secondary: #7c5cff' "$css"
          grep -q -- '--gc-target-min: 44px' "$css"
          grep -q -- '--gc-target-comfortable: 48px' "$css"
          grep -q -- '--gc-motion-instant: 90ms' "$css"
          grep -q -- '--gc-motion-fast: 160ms' "$css"
          grep -q -- '--gc-motion-standard: 220ms' "$css"
          grep -q -- '--gc-motion-emphasized: 320ms' "$css"
          grep -q '@media (max-width: 599px)' "$css"
          grep -q '@media (min-width: 600px) and (max-width: 1023px)' "$css"
          grep -q '@media (min-width: 1024px) and (max-width: 1439px)' "$css"
          grep -q '@media (min-width: 1440px)' "$css"
          grep -q 'prefers-reduced-motion: reduce' "$css"
          grep -q 'prefers-reduced-transparency: reduce' "$css"
          grep -q 'prefers-contrast: more' "$css"
          grep -q 'forced-colors: active' "$css"
          grep -q '@supports not (backdrop-filter: blur(1px))' "$css"
          grep -q 'goreecloud-empty-state' "$states"
          grep -q 'goreecloud-not-found' "$states"
          grep -q 'goreecloud-action-primary' "$states"
          grep -q 'prefers-reduced-motion: reduce' "$states"
          grep -q 'forced-colors: active' "$states"

      - name: Validate private recovery and empty-state contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'extends "simple/page_with_header.html"' searx/templates/simple/404.html
          grep -q 'goreecloud-not-found' searx/templates/simple/404.html
          grep -q 'goreecloud-empty-state' searx/templates/simple/messages/no_results.html
          grep -q 'does not automatically redirect searches to a public provider' \
            searx/templates/simple/messages/no_results.html
          if grep -q 'searx.space' searx/templates/simple/messages/no_results.html; then
            echo 'The private empty-state must not direct users to the public SearXNG instance directory.' >&2
            exit 1
          fi

      - name: Validate privacy-oriented runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'enable_metrics: false' goreecloud/settings.yml.example
          grep -q 'image_proxy: true' goreecloud/settings.yml.example
          grep -q 'query_in_title: false' goreecloud/settings.yml.example
          grep -q 'public_instance: false' goreecloud/settings.yml.example
          grep -q 'X-Robots-Tag: noindex, nofollow' goreecloud/settings.yml.example
          grep -q 'Referrer-Policy: no-referrer' goreecloud/settings.yml.example
          grep -q 'X-Frame-Options: DENY' goreecloud/settings.yml.example
          grep -q 'Permissions-Policy: "camera=(), microphone=(), geolocation=()"' \
            goreecloud/settings.yml.example
          grep -q '^    - html$' goreecloud/settings.yml.example
          grep -q '127.0.0.1:' goreecloud/compose.yml.example
          grep -q 'SEARXNG_SECRET:.*:?Set SEARXNG_SECRET' goreecloud/compose.yml.example
          if grep -Eq '^    - (json|csv|rss)$' goreecloud/settings.yml.example; then
            echo 'Machine-readable formats must remain disabled in the foundation baseline.' >&2
            exit 1
          fi

      - name: Validate hardened Compose baselines
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^    init: true$' goreecloud/compose.yml.example
          grep -q '^    stop_grace_period: 20s$' goreecloud/compose.yml.example
          grep -q 'no-new-privileges:true' goreecloud/compose.yml.example
          grep -q '^    healthcheck:$' goreecloud/compose.yml.example
          grep -q '/healthz' goreecloud/compose.yml.example
          GOREECLOUD_SEARCH_IMAGE='example.invalid/goreecloud/search:test' \
          SEARXNG_SECRET='goreecloud-ci-compose-secret' \
          docker compose -f goreecloud/compose.yml.example config --quiet

          grep -q '^    init: true$' goreecloud/compose.production.yml.example
          grep -q '^    expose:$' goreecloud/compose.production.yml.example
          grep -q '^      - "8080"$' goreecloud/compose.production.yml.example
          grep -q '^      - proxy$' goreecloud/compose.production.yml.example
          grep -q '^    external: true$' goreecloud/compose.production.yml.example
          if grep -q '^    ports:$' goreecloud/compose.production.yml.example; then
            echo 'Production Compose must not publish a host port.' >&2
            exit 1
          fi
          GOREECLOUD_SEARCH_IMAGE='example.invalid/goreecloud/search@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
          SEARXNG_SECRET='goreecloud-ci-compose-secret' \
          docker compose -f goreecloud/compose.production.yml.example config --quiet

      - name: Validate production acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n goreecloud/target_acceptance.sh
          grep -q 'This result does not by itself authorize production cutover' \
            goreecloud/target_acceptance.sh
          grep -q '/srv/docker/stacks/goreecloud-search/' \
            docs/goreecloud/TARGET-ACCEPTANCE.md
          grep -q 'goreecloud/compose.production.yml.example' \
            docs/goreecloud/TARGET-ACCEPTANCE.md
          grep -q 'general' docs/goreecloud/TARGET-ACCEPTANCE.md
          grep -q 'images' docs/goreecloud/TARGET-ACCEPTANCE.md
          grep -q 'news' docs/goreecloud/TARGET-ACCEPTANCE.md
          grep -q 'videos' docs/goreecloud/TARGET-ACCEPTANCE.md
          grep -q 'science' docs/goreecloud/TARGET-ACCEPTANCE.md
          grep -q 'rollback' docs/goreecloud/TARGET-ACCEPTANCE.md
          grep -q 'representative restore' docs/goreecloud/TARGET-ACCEPTANCE.md

      - name: Validate provider acceptance boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'workflow_dispatch:' .github/workflows/goreecloud-provider-acceptance.yml
          grep -q 'real-provider acceptance' goreecloud/provider_acceptance.py
          for category in general images news videos it science; do
            grep -q "\"$category\"" goreecloud/provider_acceptance.py
          done

      - name: Validate container naming compatibility
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'CONTAINER_IMAGE_ORGANIZATION="${CONTAINER_IMAGE_ORGANIZATION,,}"' \
            utils/lib_sxng_container.sh

      - name: Guard upstream license
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE
          grep -q 'SearXNG' searx/templates/simple/base.html
