name: GoreeCloud foundation

on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate Python source syntax
        run: python -m compileall -q searx goreecloud

      - name: Validate GoreeCloud product markers
        shell: bash
        run: |
          set -euo pipefail
          test -f GORECLOUD.md
          test -f docs/goreecloud/UPSTREAM.md
          test -f docs/goreecloud/API.md
          test -f docs/goreecloud/DEPLOYMENT.md
          test -f goreecloud/settings.yml.example
          test -f goreecloud/compose.yml.example
          test -f goreecloud/browser_acceptance.py
          test -f goreecloud/provider_acceptance.py
          test -f .github/workflows/goreecloud-runtime-smoke.yml
          test -f .github/workflows/goreecloud-container-build.yml
          test -f .github/workflows/goreecloud-browser-acceptance.yml
          test -f .github/workflows/goreecloud-provider-acceptance.yml
          test -f searx/static/themes/simple/goreecloud.css
          grep -q 'GoreeCloud Search' README.rst
          grep -q 'GoreeCloud Search' searx/templates/simple/base.html
          grep -q 'GoreeCloud Search' searx/templates/simple/index.html
          grep -q 'GoreeCloud Search' searx/templates/simple/search.html
          grep -q 'Private metasearch' searx/templates/simple/results.html
          grep -q 'GoreeCloud Search' goreecloud/settings.yml.example
          grep -q 'b2da6b90f2f8446557c91f67d6be5064ab785ecd' docs/goreecloud/UPSTREAM.md

      - name: Validate browser product contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name="application-name" content="GoreeCloud Search"' searx/templates/simple/base.html
          grep -q 'name="color-scheme" content="light dark"' searx/templates/simple/base.html
          grep -q 'rel="search"' searx/templates/simple/base.html
          grep -q 'rel="manifest"' searx/templates/simple/base.html
          grep -q 'goreecloud-page .pref-group' searx/static/themes/simple/goreecloud.css
          grep -q '_overflow_diagnostics' goreecloud/browser_acceptance.py

      - name: Validate privacy-oriented runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'image_proxy: true' goreecloud/settings.yml.example
          grep -q 'query_in_title: false' goreecloud/settings.yml.example
          grep -q 'public_instance: false' goreecloud/settings.yml.example
          grep -q '^    - html$' goreecloud/settings.yml.example
          grep -q '127.0.0.1:' goreecloud/compose.yml.example
          grep -q 'SEARXNG_SECRET:.*:?Set SEARXNG_SECRET' goreecloud/compose.yml.example
          if grep -Eq '^    - (json|csv|rss)$' goreecloud/settings.yml.example; then
            echo 'Machine-readable formats must remain disabled in the foundation baseline.' >&2
            exit 1
          fi

      - name: Validate hardened Compose baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^    init: true$' goreecloud/compose.yml.example
          grep -q '^    stop_grace_period: 20s$' goreecloud/compose.yml.example
          grep -q 'no-new-privileges:true' goreecloud/compose.yml.example
          grep -q '^    healthcheck:$' goreecloud/compose.yml.example
          grep -q '/healthz' goreecloud/compose.yml.example
          GOREECLOUD_SEARCH_IMAGE='example.invalid/goreecloud/search:test' \
          SEARXNG_SECRET='goreecloud-ci-compose-secret' \
          docker compose -f goreecloud/compose.yml.example config --quiet

      - name: Validate provider acceptance boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'workflow_dispatch:' .github/workflows/goreecloud-provider-acceptance.yml
          grep -q 'real-provider acceptance' goreecloud/provider_acceptance.py

      - name: Validate container naming compatibility
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'CONTAINER_IMAGE_ORGANIZATION="${CONTAINER_IMAGE_ORGANIZATION,,}"' utils/lib_sxng_container.sh

      - name: Guard upstream license
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE
          grep -q 'SearXNG' searx/templates/simple/base.html
