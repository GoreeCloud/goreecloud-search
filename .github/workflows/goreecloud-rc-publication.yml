---
name: GoreeCloud RC publication

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/goreecloud-rc-publication.yml'
      - '.github/workflows/goreecloud-workflow-supply-chain.yml'
      - 'goreecloud/release_candidate_request.json'
      - 'goreecloud/release_baseline.json'
      - 'goreecloud/release_evidence.py'
      - 'tests/unit/test_goreecloud_rc_publication.py'

permissions:
  contents: read
  packages: write

concurrency:
  group: goreecloud-search-rc-publication
  cancel-in-progress: false

jobs:
  release-candidate:
    if: github.repository_owner == 'GoreeCloud' && github.ref_name == 'master'
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate Release Candidate request boundary
        shell: bash
        run: |
          set -euo pipefail
          python goreecloud/release_evidence.py validate-request \
            goreecloud/release_candidate_request.json
          python goreecloud/release_evidence.py validate-baseline \
            goreecloud/release_baseline.json

          parent="$(git rev-parse "${GITHUB_SHA}^")"
          reviewed_base="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('goreecloud/release_candidate_request.json').read_text())
          print(data['reviewed_base_revision'])
          PY
          )"
          test "$parent" = "$reviewed_base"

          request_id="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('goreecloud/release_candidate_request.json').read_text())
          print(data['request_id'])
          PY
          )"
          sequence="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('goreecloud/release_candidate_request.json').read_text())
          print(data['candidate_sequence'])
          PY
          )"
          printf 'Validated request %s against reviewed parent %s\n' "$request_id" "$parent"
          printf 'GOREECLOUD_RC_REQUEST_ID=%s\n' "$request_id" >> "$GITHUB_ENV"
          printf 'GOREECLOUD_RC_SEQUENCE=%02d\n' "$sequence" >> "$GITHUB_ENV"

          changed="$(git diff --name-only "$parent" "$GITHUB_SHA")"
          test -n "$changed"
          printf '%s\n' "$changed" | grep -Fxq 'goreecloud/release_candidate_request.json'
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/goreecloud-rc-publication.yml|\
              .github/workflows/goreecloud-workflow-supply-chain.yml|\
              goreecloud/release_candidate_request.json|\
              goreecloud/release_baseline.json|\
              goreecloud/release_evidence.py|\
              tests/unit/test_goreecloud_rc_publication.py)
                ;;
              *)
                printf 'Unapproved RC boundary file: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"

      - name: Build exact GoreeCloud Search candidate
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_ACTIONS=false ./manage container.build podman
          image="$(
            podman image ls --format '{{.Repository}}:{{.Tag}}' \
              | grep -E '^localhost/goreecloud/searxng:latest$' \
              | head -n 1
          )"
          test -n "$image"
          printf 'GOREECLOUD_RC_LOCAL_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Validate candidate OCI identity
        shell: bash
        run: |
          set -euo pipefail
          title="$(
            podman image inspect \
              --format '{{ index .Labels "org.opencontainers.image.title" }}' \
              "$GOREECLOUD_RC_LOCAL_IMAGE"
          )"
          licenses="$(
            podman image inspect \
              --format '{{ index .Labels "org.opencontainers.image.licenses" }}' \
              "$GOREECLOUD_RC_LOCAL_IMAGE"
          )"
          source="$(
            podman image inspect \
              --format '{{ index .Labels "org.opencontainers.image.source" }}' \
              "$GOREECLOUD_RC_LOCAL_IMAGE"
          )"
          revision="$(
            podman image inspect \
              --format '{{ index .Labels "org.opencontainers.image.revision" }}' \
              "$GOREECLOUD_RC_LOCAL_IMAGE"
          )"
          version="$(
            podman image inspect \
              --format '{{ index .Labels "org.opencontainers.image.version" }}' \
              "$GOREECLOUD_RC_LOCAL_IMAGE"
          )"
          test "$title" = 'GoreeCloud Search'
          test "$licenses" = 'AGPL-3.0-or-later'
          test "$source" = 'https://github.com/GoreeCloud/goreecloud-search'
          test "$revision" = "$GITHUB_SHA"
          test -n "$version"
          printf 'GOREECLOUD_RC_OCI_REVISION=%s\n' "$revision" >> "$GITHUB_ENV"
          printf 'GOREECLOUD_RC_OCI_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Prepare isolated runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-rc-searxng
          cp goreecloud/settings.yml.example .ci-rc-searxng/settings.yml

      - name: Rehearse local candidate and known-good rollback
        shell: bash
        run: |
          set -euo pipefail
          rollback_image="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('goreecloud/release_baseline.json').read_text())
          print(data['image'])
          PY
          )"
          podman pull "$rollback_image"

          run_acceptance() {
            name="$1"
            port="$2"
            image="$3"
            index="/tmp/${name}-index.html"

            podman run --detach \
              --name "$name" \
              --publish "127.0.0.1:${port}:8080" \
              --env SEARXNG_SECRET=goreecloud-rc-evidence-only-secret \
              --env FORCE_OWNERSHIP=false \
              --volume "$PWD/.ci-rc-searxng:/etc/searxng:ro" \
              "$image" >/dev/null

            ready=0
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error \
                "http://127.0.0.1:${port}/" >"$index" \
                && curl --fail --silent --show-error \
                  "http://127.0.0.1:${port}/healthz" >/tmp/healthz.txt; then
                ready=1
                break
              fi
              if [ "$(podman inspect -f '{{.State.Running}}' "$name" 2>/dev/null || true)" != 'true' ]; then
                podman logs "$name" || true
                return 1
              fi
              sleep 1
            done
            test "$ready" = '1'
            grep -q '<title>GoreeCloud Search</title>' "$index"
            grep -q 'goreecloud.css' "$index"
            podman rm --force "$name" >/dev/null
          }

          run_acceptance goreecloud-search-rc-local 8888 "$GOREECLOUD_RC_LOCAL_IMAGE"
          run_acceptance goreecloud-search-rc-rollback 8889 "$rollback_image"

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | podman login ghcr.io \
                --username '${{ github.actor }}' \
                --password-stdin

      - name: Publish immutable Release Candidate
        shell: bash
        run: |
          set -euo pipefail
          target="ghcr.io/goreecloud/goreecloud-search:rc-${GOREECLOUD_RC_SEQUENCE}-${GITHUB_SHA}"
          podman tag "$GOREECLOUD_RC_LOCAL_IMAGE" "$target"
          podman push --digestfile /tmp/rc-digest "$target"
          digest="$(cat /tmp/rc-digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          candidate="ghcr.io/goreecloud/goreecloud-search@${digest}"
          printf '%s\n' "$candidate" > candidate-image.txt
          printf 'GOREECLOUD_RC_IMAGE=%s\n' "$candidate" >> "$GITHUB_ENV"

      - name: Verify published digest and rehearse immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          podman pull "$GOREECLOUD_RC_IMAGE"
          podman image inspect "$GOREECLOUD_RC_IMAGE" >/dev/null
          podman run --detach \
            --name goreecloud-search-rc-digest \
            --publish 127.0.0.1:8890:8080 \
            --env SEARXNG_SECRET=goreecloud-rc-digest-evidence-only-secret \
            --env FORCE_OWNERSHIP=false \
            --volume "$PWD/.ci-rc-searxng:/etc/searxng:ro" \
            "$GOREECLOUD_RC_IMAGE" >/dev/null

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8890/ >/tmp/rc-digest-index.html \
              && curl --fail --silent --show-error \
                http://127.0.0.1:8890/healthz >/tmp/rc-digest-healthz.txt; then
              ready=1
              break
            fi
            if [ "$(podman inspect -f '{{.State.Running}}' goreecloud-search-rc-digest)" != 'true' ]; then
              podman logs goreecloud-search-rc-digest || true
              exit 1
            fi
            sleep 1
          done
          test "$ready" = '1'
          grep -q '<title>GoreeCloud Search</title>' /tmp/rc-digest-index.html
          grep -q 'goreecloud.css' /tmp/rc-digest-index.html

      - name: Write checksummed RC evidence
        shell: bash
        run: |
          set -euo pipefail
          python goreecloud/release_evidence.py write \
            --request-file goreecloud/release_candidate_request.json \
            --rollback-baseline goreecloud/release_baseline.json \
            --source-sha "$GITHUB_SHA" \
            --candidate-image "$GOREECLOUD_RC_IMAGE" \
            --candidate-oci-revision "$GOREECLOUD_RC_OCI_REVISION" \
            --candidate-oci-version "$GOREECLOUD_RC_OCI_VERSION" \
            --output release-evidence.json
          cp goreecloud/release_candidate_request.json release-candidate-request.json
          cp goreecloud/release_baseline.json release-baseline.json
          sha256sum \
            candidate-image.txt \
            release-candidate-request.json \
            release-evidence.json \
            release-baseline.json \
            > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Show runtime diagnostics on failure
        if: failure()
        shell: bash
        run: |
          podman image ls || true
          podman ps -a || true
          podman logs goreecloud-search-rc-local || true
          podman logs goreecloud-search-rc-rollback || true
          podman logs goreecloud-search-rc-digest || true

      - name: Clean isolated evidence containers
        if: always()
        shell: bash
        run: |
          podman rm --force goreecloud-search-rc-local || true
          podman rm --force goreecloud-search-rc-rollback || true
          podman rm --force goreecloud-search-rc-digest || true

      - name: Upload Release Candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: goreecloud-search-rc-${{ env.GOREECLOUD_RC_SEQUENCE }}-${{ github.sha }}
          path: |
            candidate-image.txt
            release-candidate-request.json
            release-evidence.json
            release-baseline.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90
