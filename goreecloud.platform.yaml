schema_version: 1

product:
  name: GoreeCloud Search
  repository: GoreeCloud/goreecloud-search
  type: service
  version: 0.1.0.dev12
  lifecycle: development
  stable: false
  license: AGPL-3.0-or-later

runtime_scope:
  implemented:
    - local-query-parsing
    - source-planning
    - search-index-contract-v1
    - result-normalization-and-deduplication
    - deterministic-ranking-and-explanations
    - provider-execution-orchestration
    - query-disclosure-budgeting
    - content-policy-hooks
    - local-lens-reranking
    - portable-lens-format-v1
    - index-cursor-pagination
    - loopback-development-http-api-v1
    - container-network-development-http-api-v1
    - vps-docker-development-profile
    - runtime-file-secret-input
    - private-vps-server-rendered-web-ui
    - opensearch-discovery
  provider_execution_orchestration: true
  query_disclosure_budgeting: true
  content_policy_hooks: true
  local_lens_reranking: true
  portable_lens_format: goreecloud.search-lens.v1
  production_safesearch_classifier: false
  built_in_live_network_provider: true
  persistent_user_state: false
  user_interface: true
  local_development_http_api: true
  container_network_development_http_api: true
  vps_docker_development_profile: true
  runtime_file_secret_input: true
  private_vps_web_ui: true
  opensearch_discovery: true
  private_reverse_proxy_candidate: true
  host_port_publication_required: false
  public_http_listener: false
  administrator_interface: false

platform_systems:
  goreecloud_manager:
    applicable: true
    status: not_implemented
    conformance: blocked
    reason: Administrative inventory, health, configuration, and lifecycle integration is planned but absent.
  privacy_shield:
    applicable: true
    status: not_implemented
    conformance: blocked
    reason: The planner and executor enforce source-plan boundaries and optional third-party disclosure budgets, but no Privacy Shield runtime authorization contract is integrated for live network providers.
  wardveil_security:
    applicable: true
    status: not_implemented
    conformance: blocked
    reason: Local execution controls include timeouts, cancellation, failure isolation, provenance validation, strict Lens document parsing, and fail-closed content-policy hook handling, but no Wardveil runtime contract or production safety-classification feed is integrated.
  everkeep:
    applicable: true
    status: not_implemented
    conformance: blocked
    reason: Search is currently stateless at the application layer, but the VPS deployment requires recoverable configuration, protected secret restoration, immutable artifact rollback, and verified target-host recovery evidence. The native repository has not yet integrated an accepted Everkeep recovery contract.
  glaze_ui:
    applicable: true
    target_version: 1.5.1
    status: development_adoption_unaccepted
    conformance: blocked
    reason: A GoreeCloud-controlled private VPS Search web surface now exists and targets the current Stable Glaze UI 1.5.1 semantics. Source-level responsive, focus, contrast, motion/transparency fallback, material, local-asset, state-truth, and accessibility behavior is implemented, but no Search-specific exact-revision rendered, assistive-technology, human, supported-browser/device, or target-runtime acceptance exists and shared consumer-registry acceptance has not been established.
  goreecloud_mesh:
    applicable: true
    status: not_implemented
    conformance: blocked
    reason: Service discovery, capability exchange, events, and integration coordination are planned but absent.
  goreecloud_identity:
    applicable: true
    status: not_implemented
    conformance: blocked
    reason: Development local/container HTTP boundaries and an external provider credential path exist, but GoreeCloud Identity integration remains absent and is required before protected or production service operations are accepted.
  goreecloud_policy:
    applicable: true
    status: not_implemented
    conformance: blocked
    reason: Search has local source-planning and content-policy rules, but no current GoreeCloud Policy runtime contract, policy/version identity, rule-authority evidence, or enforcement-result integration is implemented.
  goreecloud_observability:
    applicable: true
    status: partial_local_health_only
    conformance: blocked
    reason: Search exposes a health endpoint and bounded provider execution evidence, and the VPS candidate defines container health/log rotation, but no accepted GoreeCloud Observability contract, target-host monitoring integration, signal freshness evidence, alerting, or operational acceptance exists.

specialized_services:
  goreecloud_sync:
    applicable: false
    status: not_applicable_current_runtime
    reason: Portable Lens serialization exists, but the runtime still persists or synchronizes no Lens state, search history, preferences, or other user data.

evidence:
  status: development_candidate
  accepted_revision: null
  stable_qualification: blocked
  notes:
    - A declaration is not implementation evidence.
    - CI passing does not establish Platform-System conformance, target-host deployment acceptance, or Stable qualification.
    - This schema_version 1 declaration is transitional and does not itself establish complete Integral Platform Systems v3.0 nine-system conformance.
    - The VPS Docker profile and private web UI are Development candidates only; no native image from this rewritten repository is recorded as deployed on goreecloud-vps-01.
    - Glaze UI 1.5.1 is the required Stable target, not an accepted conformance claim.
