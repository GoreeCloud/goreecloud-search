schema_version: 1

product:
  name: GoreeCloud Search
  repository: GoreeCloud/goreecloud-search
  type: service
  version: 0.1.0.dev5
  lifecycle: development
  stable: false

runtime_scope:
  implemented:
    - local-query-parsing
    - source-planning
    - search-index-contract-v1
    - result-normalization-and-deduplication
    - deterministic-ranking-and-explanations
    - provider-execution-orchestration
    - query-disclosure-budgeting
    - index-cursor-pagination
  provider_execution_orchestration: true
  query_disclosure_budgeting: true
  built_in_live_network_provider: false
  persistent_user_state: false
  user_interface: false
  administrator_interface: false

platform_systems:
  goreecloud_manager:
    applicable: true
    status: not_implemented
    conformance: blocked
    reason: Administrative inventory, health, configuration, and lifecycle integration is planned but absent.

  privacy_shield:
    applicable: true
    status: not_implemented
    conformance: blocked
    reason: The planner and executor enforce source-plan boundaries and optional third-party disclosure budgets, but no Privacy Shield runtime authorization contract is integrated for live network providers.

  wardveil_security:
    applicable: true
    status: not_implemented
    conformance: blocked
    reason: Local execution controls include timeouts, cancellation, failure isolation, and provenance validation, but no Wardveil runtime contract is integrated.

  everkeep:
    applicable: false
    status: not_applicable_current_runtime
    conformance: not_applicable
    reason: This runtime slice is stateless and persists no material user or service data. Re-evaluate when persistent state or deployment recovery is introduced.

  glaze_ui:
    applicable: false
    status: not_applicable_current_runtime
    conformance: not_applicable
    reason: No GoreeCloud-controlled user or administrator interface exists in this runtime slice. Re-evaluate before any UI is accepted.

  goreecloud_mesh:
    applicable: true
    status: not_implemented
    conformance: blocked
    reason: Service discovery, capability exchange, events, and integration coordination are planned but absent.

  goreecloud_identity:
    applicable: true
    status: not_implemented
    conformance: blocked
    reason: No authenticated live network provider or administrative interface exists yet; Identity integration is required before protected service operations are accepted.

specialized_services:
  goreecloud_sync:
    applicable: false
    status: not_applicable_current_runtime
    reason: No search history, preferences, or other synchronized persistent user state exists in this runtime slice.

evidence:
  status: development_candidate
  accepted_revision: null
  stable_qualification: blocked
  notes:
    - A declaration is not implementation evidence.
    - CI passing does not establish Platform-System conformance or Stable qualification.
