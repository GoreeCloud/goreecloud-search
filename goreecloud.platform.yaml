schema_version: '0.3'

component:
  type: application
  id: goreecloud-search
  product_name: GoreeCloud Search
  repository: GoreeCloud/goreecloud-search

lifecycle: development
version: unreleased-development

supported_platforms:
  - web

api:
  versions:
    - v1
  endpoints:
    - name: search-api
      url: /api/v1/search
      purpose: Machine-readable native Search query endpoint for the Development application.
    - name: status-api
      url: /api/v1/status
      purpose: Bounded native application and capability status.
    - name: readiness-api
      url: /api/v1/readiness
      purpose: Local native application readiness without production-provider or deployment claims.
    - name: provider-definitions-api
      url: /api/v1/providers/definitions
      purpose: Sanitized read-only configured-provider capability definitions without credentials or endpoint disclosure.
    - name: sync-capabilities-api
      url: /api/v1/sync/capabilities
      purpose: Read-only declaration of Search-owned datasets that may participate in authorized GoreeCloud Sync coordination.
    - name: platform-status-api
      url: /api/v1/platform/status
      purpose: Bounded Search-local projection of applicable Integral Platform System evidence state.

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
    notes: GoreeCloud Manager operational visibility is applicable, but no accepted Manager runtime integration exists for Search.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - native/internal/platformstate/platformstate.go
      - native/internal/platformstate/platformstate_test.go
    notes: Search contains a fail-closed Privacy Shield evidence projection boundary and a validated capability-reference verification protocol client, but accepted producer-authoritative runtime privacy evidence, authenticated transport, and production acceptance remain unavailable.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - docs/goreecloud/PLATFORM-STATUS.md
      - native/internal/platformstate/mesh_envelope.go
      - native/internal/platformstate/platformstate.go
      - native/internal/platformstate/platformstate_test.go
      - native/internal/mediaproxy/proxy.go
      - native/internal/providers/httpjson.go
    notes: Search implements bounded source-level security controls plus producer-bound Mesh provenance validation for Wardveil evidence, but producer-authoritative Wardveil runtime acceptance and production security validation remain incomplete.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - docs/goreecloud/PLATFORM-STATUS.md
      - native/internal/platformstate/platformstate.go
      - native/internal/platformstate/platformstate_test.go
    notes: Search can fail-closed project supplied Everkeep continuity evidence, but accepted backup, restore, recovery, migration, and rollback evidence for the native application remains incomplete.
  glaze_ui:
    result: applicable-migration-required
    version: '1.4.0'
    evidence:
      - README.md
      - SPECIFICATIONS.md
      - native/internal/webui
      - native/internal/webui/assets/appearance.js
      - native/internal/webui/assets/app.css
      - native/browser_results_acceptance.py
      - native/browser_image_acceptance.py
      - native/browser_glaze_acceptance.py
      - native/browser_glaze_resilience_acceptance.py
      - native/browser_glaze_large_text_acceptance.py
    notes: Search Development source now targets the current Official Stable GLAZE UI V1.4 / 1.4.0 Optical Intelligence baseline. Repository-local source and deterministic browser checks exist, but V1.4 application-specific rendered, accessibility, localization/RTL, representative-device/form-factor, target-environment, and production acceptance remain incomplete, so whole-application conformance is still migration-required.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - docs/goreecloud/PLATFORM-STATUS.md
      - native/docs/CAPABILITY-EVIDENCE.md
      - native/internal/platformstate/mesh_envelope.go
      - native/internal/platformstate/platformstate.go
      - native/internal/platformstate/platformstate_test.go
    notes: Search capability semantics and fail-closed Mesh evidence-envelope validation exist in source, but accepted GoreeCloud Mesh registration, discovery, transport, event, dependency, and runtime evidence integration remains incomplete.
    capabilities:
      - search.query
      - search.preferences
      - search.history
      - search.sources
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - native/docs/CAPABILITY-EVIDENCE.md
    notes: GoreeCloud Identity must own account, authentication, authorization, session, requester identity, and service identity for account-bound or protected Search capabilities; accepted direct-service authentication and runtime integration remain incomplete.

health:
  health_endpoint: /healthz
  readiness_endpoint: /api/v1/readiness

continuity:
  backup:
    required: true
    requirements:
      - Protect native Search deployment configuration, approved provider policy/configuration, and durable account-bound Search state through the approved Everkeep recovery model.
      - Keep reusable provider credentials and other secrets outside ordinary repository and portable backup evidence unless an explicitly protected recovery mechanism requires them.
  restore:
    required: true
    requirements:
      - Validate restoration of native Search configuration and durable state into an isolated clean environment before Stable or production acceptance.
      - Verify provider policy, secret references, data-state integrity, and rollback behavior for the exact release candidate.
  export:
    required: true
    requirements:
      - Provide user-controlled export for durable Search preferences and history when those datasets are enabled and retained.
      - Keep provider credentials, internal trust evidence, and unrelated administrative state out of user export payloads.
  portability:
    required: true
    requirements:
      - Keep Search-owned durable user data and migration-relevant configuration in documented versioned formats that do not require the transitional SearXNG product architecture.

external_dependencies:
  - name: production-approved-search-provider
    purpose: At least one separately approved and accepted result provider is required for meaningful production search retrieval; no specific provider is currently selected by this Development manifest.
    required: true
    version_constraint: null
  - name: distroless-static-debian13-nonroot
    purpose: Minimal third-party runtime base for the optional native Development OCI packaging path; it remains subordinate to the GoreeCloud-owned application binary and is pinned by immutable digest.
    required: false
    version_constraint: sha256:f7f8f729987ad0fdf6b05eeeae94b26e6a0f613bdf46feea7fc40f7bd72953e6

compatibility:
  platform_contract: '0.3'
  glaze_ui_required: '1.4.0'
  requires:
    - goreecloud-platform-contract==0.3
    - glaze-ui==1.4.0
  provides:
    - search-api-v1
    - search-provider-contract-v1

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - SPECIFICATIONS.md
    - docs/goreecloud/PLATFORM-STATUS.md
    - docs/goreecloud/DEPLOYMENT.md
    - native/docs/PROVIDER-RUNTIME.md
    - native/docs/CAPABILITY-EVIDENCE.md
    - native/docs/ARTIFACT-PROVENANCE.md
    - native/docs/CONTAINER-PROVENANCE.md
    - native/container/Containerfile
    - .github/workflows/goreecloud-native-development-artifact.yml
    - .github/workflows/goreecloud-native-container-development.yml
    - native/internal/platformstate/mesh_envelope.go
    - native/internal/platformstate/platformstate.go
    - native/internal/providers/runtime_test.go
    - native/cmd/searchd/category_acceptance_test.go
  blockers:
    - GoreeCloud Manager operational integration and acceptance are incomplete.
    - Producer-authoritative Privacy Shield runtime evidence, authenticated verification transport, and Search privacy acceptance are incomplete.
    - Producer-authoritative Wardveil Security runtime evidence and Search security acceptance are incomplete.
    - Everkeep backup, restore, recovery, migration, and rollback acceptance are incomplete.
    - Current Stable GLAZE UI V1.4 / 1.4.0 is the required Search baseline and Development source targets it, but Search-specific rendered, accessibility, localization/RTL, representative-device/form-factor, target-environment, and production acceptance evidence remain incomplete.
    - GoreeCloud Mesh registration, coordination, dependency/event integration, and runtime acceptance are incomplete.
    - GoreeCloud Identity account, authentication, authorization, session, requester/service identity, and direct-service authentication integration is incomplete for protected capabilities.
    - GoreeCloud Sync remains a separate application/service capability; its runtime dataset registration, authenticated synchronization, cross-device reconciliation, conflict/deletion handling, and production acceptance are incomplete where Search synchronization is enabled.
    - No production-approved external Search provider, provider credentials integration, or provider-specific privacy, terms, rate-limit, abuse, timestamp-authority, live-result, and target-runtime acceptance is established.
    - Live General, Images, Videos, News, and Files category acceptance against approved providers is incomplete.
    - Native Development binary and OCI packaging provenance exist, but Release Candidate publication/signing or attestation policy, immutable production release identity, target-host deployment provenance, migration parity, controlled cutover from the transitional runtime, monitoring, alerting, rollback, and exact production deployment verification remain incomplete.
    - No Stable or production-approved GoreeCloud Search release evidence is declared.
