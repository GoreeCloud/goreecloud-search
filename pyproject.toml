[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goreecloud-search"
version = "0.1.0.dev8"
description = "Privacy-first GoreeCloud Search core with transparent source planning, bounded provider execution, query-disclosure budgets, content-policy hooks, Index contracts, normalization, and deterministic ranking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
goreecloud-search = "goreecloud_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
